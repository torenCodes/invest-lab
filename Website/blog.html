<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Blog — The Invest Lab</title>
  <meta name="description" content="Research notes, sector deep-dives, and market observations from The Invest Lab.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <style>
    /* ── Blog hero (listing + post) ─────────────────────────────────────── */
    .blog-hero {
      background: var(--bg-dark);
      position: relative;
      padding: clamp(3rem, 7vw, 5.5rem) 0 clamp(2.5rem, 5vw, 4rem);
      overflow: hidden;
    }

    .blog-hero-sm {
      padding: clamp(2rem, 4vw, 3rem) 0;
    }

    .blog-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 15% 60%, rgba(56,189,166,0.22) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 20%, rgba(56,189,166,0.10) 0%, transparent 45%);
      pointer-events: none;
    }

    .blog-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(255,255,255,0.016) 0px,
        rgba(255,255,255,0.016) 1px,
        transparent 1px,
        transparent 14px
      );
      pointer-events: none;
    }

    .blog-hero > .container { position: relative; z-index: 2; }

    .blog-back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      margin-bottom: 1.75rem;
      transition: color 0.15s;
    }

    .blog-back:hover { color: var(--accent); }

    .blog-hero-eyebrow {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .blog-hero-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(2rem, 5.5vw, 3.8rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.025em;
      color: #ffffff;
      margin-bottom: 1.75rem;
      max-width: 24ch;
    }

    .blog-hero-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .blog-meta-item {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.45);
    }

    .blog-meta-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      flex-shrink: 0;
      display: inline-block;
    }

    .blog-meta-tag {
      font-size: 0.63rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.2rem 0.6rem;
      background: rgba(56,189,166,0.2);
      color: var(--accent);
      border-radius: var(--radius);
      border: 1px solid rgba(56,189,166,0.35);
    }

    /* ── Article body ────────────────────────────────────────────────────── */
    .blog-article {
      padding: clamp(3rem, 6vw, 5rem) 0 clamp(4rem, 8vw, 7rem);
    }

    /* h1 is already shown in the hero — hide the one rendered from markdown */
    .blog-body h1 { display: none; }

    .blog-body h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(1.45rem, 3vw, 1.95rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      line-height: 1.15;
      margin: 3rem 0 1rem;
    }

    .blog-body h2::after {
      content: '';
      display: block;
      width: 2.25rem;
      height: 2px;
      background: var(--accent);
      margin-top: 0.55rem;
      border-radius: 1px;
    }

    .blog-body h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--ink);
      margin: 2rem 0 0.6rem;
    }

    .blog-body p {
      font-size: 1.05rem;
      line-height: 1.85;
      color: var(--ink-2);
      margin-bottom: 1.35rem;
    }

    .blog-body p:last-child { margin-bottom: 0; }
    .blog-body strong { color: var(--ink); font-weight: 600; }

    .blog-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2.25rem 0;
    }

    /* Disclaimer — the final italic paragraph after last hr */
    .blog-body hr:last-of-type + p > em:only-child {
      font-size: 0.85rem;
      color: var(--ink-3);
      display: block;
      background: rgba(56,189,166,0.04);
      border: 1px solid var(--accent-light);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      padding: 0.85rem 1.1rem;
      font-style: normal;
    }

    .blog-body ul {
      list-style: none;
      padding: 0;
      margin: 0.5rem 0 1.35rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .blog-body ul li {
      font-size: 1.05rem;
      line-height: 1.75;
      color: var(--ink-2);
      position: relative;
      padding-left: 1.4rem;
    }

    .blog-body ul li::before {
      content: '▸';
      color: var(--accent);
      font-size: 0.7rem;
      position: absolute;
      left: 0;
      top: 0.42rem;
    }

    .blog-body blockquote {
      border-left: 3px solid var(--accent);
      background: rgba(56,189,166,0.06);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 1.1rem 1.4rem;
      margin: 1.5rem 0;
    }

    .blog-body blockquote p { color: var(--ink); font-weight: 500; margin-bottom: 0; }

    /* ── Loading state ───────────────────────────────────────────────────── */
    .blog-loading {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-3);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

  <!-- ── Navigation ──────────────────────────────────────────────────────── -->
  <header class="site-header">
    <nav class="nav container">
      <a href="index.html" class="nav-logo">
        <img src="images/logo.png" alt="The Invest Lab" class="nav-logo-img">
        <span class="logo-text">The Invest Lab</span>
      </a>
      <ul class="nav-links">
        <li class="nav-item">
          <a href="index.html#dashboards" class="nav-link">Dashboards <span class="nav-chevron">▾</span></a>
          <ul class="nav-dropdown">
            <li><a href="https://invest-movers-shakers.onrender.com" class="nav-dropdown-link" target="_blank" rel="noopener">Movers and Shakers</a></li>
            <li><a href="https://invest-tried-true.onrender.com" class="nav-dropdown-link" target="_blank" rel="noopener">Tried and True</a></li>
            <li><a href="https://invest-insider-buying.onrender.com" class="nav-dropdown-link" target="_blank" rel="noopener">Insider Buying</a></li>
          </ul>
        </li>
        <li><a href="index.html#about" class="nav-link">About</a></li>
        <li><a href="blog.html" class="nav-link" style="color:var(--accent)">Blog</a></li>
      </ul>
    </nav>
  </header>

  <!-- ── Dynamic content injected here by JS ─────────────────────────────── -->
  <div id="blog-root"><div class="blog-loading">Loading…</div></div>

  <!-- ── Footer ───────────────────────────────────────────────────────────── -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-inner">
        <span class="footer-logo">
          <img src="images/logo.png" alt="The Invest Lab" class="footer-logo-img">
          The Invest Lab
        </span>
        <p class="footer-disclaimer">Not financial advice. For personal educational use only.</p>
        <p class="footer-disclaimer"><a href="mailto:contact@theinvestlab.com" style="color:rgba(255,255,255,0.55);text-decoration:none;transition:color 0.15s;" onmouseover="this.style.color='rgba(255,255,255,0.9)'" onmouseout="this.style.color='rgba(255,255,255,0.55)'">contact@theinvestlab.com</a></p>
        <p class="footer-copy">Built with curiosity and caffeine.</p>
      </div>
    </div>
  </footer>

  <script>
  (function () {
    var root = document.getElementById('blog-root');
    var slug = new URLSearchParams(window.location.search).get('post');

    slug ? loadPost(slug) : loadListing();

    // ── Listing view ──────────────────────────────────────────────────────

    function loadListing() {
      fetch('Blog/posts.json')
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(renderListing)
        .catch(function () { root.innerHTML = errHtml('Unable to load posts — please try again later.'); });
    }

    function renderListing(posts) {
      var cards = posts.map(function (p) {
        var tags = (p.tags || []).map(function (t) {
          return '<span class="blog-card-tag">' + esc(t) + '</span>';
        }).join('');
        return (
          '<article class="blog-card">' +
            '<div class="blog-card-meta">' +
              '<span class="blog-card-date">' + esc(p.date) + '</span>' + tags +
            '</div>' +
            '<h2 class="blog-card-title">' + esc(p.title) + '</h2>' +
            '<p class="blog-card-excerpt">' + esc(p.excerpt) + '</p>' +
            '<a href="blog.html?post=' + esc(p.slug) + '" class="blog-card-read-more">Read more →</a>' +
          '</article>'
        );
      }).join('');

      root.innerHTML =
        '<section class="blog-hero blog-hero-sm">' +
          '<div class="container">' +
            '<a href="index.html#blog" class="blog-back">← Back to home</a>' +
            '<p class="blog-hero-eyebrow">Insights</p>' +
            '<h1 class="blog-hero-title" style="font-size:clamp(1.8rem,4vw,2.8rem);margin-bottom:0">Research Blog</h1>' +
          '</div>' +
        '</section>' +
        '<section class="section">' +
          '<div class="container">' +
            '<div class="blog-grid">' + cards + '</div>' +
          '</div>' +
        '</section>';
    }

    // ── Post view ─────────────────────────────────────────────────────────

    function loadPost(slug) {
      Promise.all([
        fetch('Blog/posts.json').then(function (r) { return r.ok ? r.json() : []; }),
        fetch('Blog/' + slug + '.md').then(function (r) {
          if (!r.ok) throw new Error('not found');
          return r.text();
        })
      ])
      .then(function (res) {
        var meta = (res[0] || []).find(function (p) { return p.slug === slug; }) || {};
        renderPost(meta, res[1]);
      })
      .catch(function () {
        root.innerHTML =
          '<section class="section" style="min-height:60vh">' +
            '<div class="container">' +
              '<a href="blog.html" style="color:var(--accent-dark);font-size:0.8rem;font-weight:600;text-decoration:none;">← Back to Blog</a>' +
              '<p style="margin-top:2rem;color:var(--ink-3)">Post not found.</p>' +
            '</div>' +
          '</section>';
      });
    }

    function renderPost(meta, mdText) {
      if (meta.title) document.title = meta.title + ' — The Invest Lab';

      // Strip the h1 and *Published date* / opening --- from markdown body
      var body = mdText
        .replace(/^#[^\n]*\n+/, '')
        .replace(/^\*[^\n]*\*\s*\n+---\n+/, '')
        .trim();

      var htmlBody = marked.parse(body);

      var metaParts = [];
      if (meta.date)     metaParts.push('<span class="blog-meta-item">' + esc(meta.date) + '</span>');
      if (meta.readTime) metaParts.push('<span class="blog-meta-item">' + esc(meta.readTime) + '</span>');
      var metaHtml = metaParts.join('<span class="blog-meta-dot"></span>');

      var tagsHtml = (meta.tags || []).map(function (t) {
        return '<span class="blog-meta-tag">' + esc(t) + '</span>';
      }).join('');
      if (tagsHtml) metaHtml += (metaHtml ? '<span class="blog-meta-dot"></span>' : '') + tagsHtml;

      root.innerHTML =
        '<section class="blog-hero">' +
          '<div class="container">' +
            '<a href="blog.html" class="blog-back">← Back to Blog</a>' +
            '<p class="blog-hero-eyebrow">Research Blog</p>' +
            '<h1 class="blog-hero-title">' + esc(meta.title || '') + '</h1>' +
            '<div class="blog-hero-meta">' + metaHtml + '</div>' +
          '</div>' +
        '</section>' +
        '<section class="blog-article">' +
          '<div class="container">' +
            '<div class="blog-body">' + htmlBody + '</div>' +
          '</div>' +
        '</section>';
    }

    // ── Helpers ───────────────────────────────────────────────────────────

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function errHtml(msg) {
      return '<div class="blog-loading">' + esc(msg) + '</div>';
    }

  }());
  </script>

</body>
</html>
