<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Blog — The Invest Lab</title>
  <meta name="description" content="Long-form research from The Invest Lab on the industries and supply chains shaping the market, starting with the physical buildout behind AI.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://theinvestlab.com/blog.html">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Open Graph (defaults; JS updates title/description/url per post) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://theinvestlab.com/blog.html">
  <meta property="og:title" content="Research Blog — The Invest Lab">
  <meta property="og:description" content="Long-form research from The Invest Lab on the industries and supply chains shaping the market, starting with the physical buildout behind AI.">
  <meta property="og:image" content="https://theinvestlab.com/images/charts.jpg">
  <meta property="og:image:width" content="1152">
  <meta property="og:image:height" content="768">
  <meta property="og:image:alt" content="Analyst in front of a wall of stock charts">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Research Blog — The Invest Lab">
  <meta name="twitter:description" content="Long-form research from The Invest Lab on the industries and supply chains shaping the market, starting with the physical buildout behind AI.">
  <meta name="twitter:image" content="https://theinvestlab.com/images/charts.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
</head>
<body>

  <!-- ── Navigation ──────────────────────────────────────────────────────── -->
  <header class="site-header">
    <nav class="nav container">
      <a href="index.html" class="nav-logo">
        <img src="images/logo.png" alt="The Invest Lab" class="nav-logo-img" width="521" height="521">
        <span class="logo-text">The Invest Lab</span>
      </a>
      <button class="nav-burger" aria-label="Menu" onclick="document.querySelector('.nav-links').classList.toggle('open')">&#9776;</button>
      <ul class="nav-links">
        <li class="nav-item">
          <a href="index.html#dashboards" class="nav-link">Dashboards <span class="nav-chevron">▾</span></a>
          <ul class="nav-dropdown">
            <li><a href="https://invest-movers-shakers.onrender.com" class="nav-dropdown-link">Movers and Shakers</a></li>
            <li><a href="https://invest-the-marathon.onrender.com" class="nav-dropdown-link">The Marathon</a></li>
            <li><a href="https://invest-insider-buying.onrender.com" class="nav-dropdown-link">Insider Buying</a></li>
            <li><a href="https://invest-patterns.onrender.com" class="nav-dropdown-link">Pattern Scanner</a></li>
            <li><a href="https://invest-the-analyst.onrender.com" class="nav-dropdown-link">The Analyst</a></li>
          </ul>
        </li>
        <li><a href="https://theinvestlab.com/blog.html" class="nav-link" style="color:var(--accent)">Blog</a></li>
        <li><a href="index.html#about" class="nav-link">About</a></li>
      </ul>
    </nav>
  </header>

  <!-- ── Dynamic content injected here by JS ─────────────────────────────── -->
  <div id="blog-root"><div class="blog-loading">Loading…</div></div>

  <!-- ── Footer ───────────────────────────────────────────────────────────── -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-inner">
        <span class="footer-logo">
          <img src="images/logo.png" alt="The Invest Lab" class="footer-logo-img" width="521" height="521" loading="lazy">
          The Invest Lab
        </span>
        <p class="footer-disclaimer">Not financial advice. For personal educational use only.</p>
        <p class="footer-disclaimer"><a href="mailto:contact@theinvestlab.com" style="color:rgba(255,255,255,0.55);text-decoration:none;transition:color 0.15s;" onmouseover="this.style.color='rgba(255,255,255,0.9)'" onmouseout="this.style.color='rgba(255,255,255,0.55)'">contact@theinvestlab.com</a></p>
        <p class="footer-copy">Built with curiosity and caffeine.</p>
      </div>
    </div>
  </footer>

  <script>
  (function () {
    var root = document.getElementById('blog-root');
    var slug = new URLSearchParams(window.location.search).get('post');

    slug ? loadPost(slug) : loadListing();

    // ── Listing view ──────────────────────────────────────────────────────

    function loadListing() {
      fetch('Blog/posts.json')
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(renderListing)
        .catch(function () { root.innerHTML = errHtml('Unable to load posts. Please try again later.'); });
    }

    function renderListing(posts) {
      // posts.json is ordered newest-first
      var latest    = posts[0];
      var firstPost = posts[posts.length - 1];

      var heroCta = '';
      if (latest) {
        heroCta += '<a href="blog.html?post=' + esc(latest.slug) + '" class="btn btn-primary">Read Latest</a>';
      }
      // Hide "Read First Entry" if there's only one post (would link to the same place)
      if (firstPost && posts.length > 1) {
        heroCta += '<a href="blog.html?post=' + esc(firstPost.slug) + '" class="btn btn-ghost">Read First Entry</a>';
      }

      var cards = posts.map(function (p) {
        var tags = (p.tags || []).map(function (t) {
          return '<span class="blog-card-tag">' + esc(t) + '</span>';
        }).join('');
        // Whole card is an <a> — matches the .dashboard-card / .preview-card pattern.
        // Inner "Read more" cue is a <span> (nested anchors are invalid HTML).
        return (
          '<a class="blog-card" href="blog.html?post=' + esc(p.slug) + '">' +
            '<div class="blog-card-meta">' +
              '<span class="blog-card-date">' + esc(p.date) + '</span>' + tags +
            '</div>' +
            '<h2 class="blog-card-title">' + esc(p.title) + '</h2>' +
            '<p class="blog-card-excerpt">' + esc(p.excerpt) + '</p>' +
            '<span class="blog-card-read-more">Read more →</span>' +
          '</a>'
        );
      }).join('');

      root.innerHTML =
        '<section class="blog-hero">' +
          '<div class="container hero-container">' +
            '<div class="hero-content">' +
              '<h1 class="blog-hero-title">Research Blog</h1>' +
              '<p class="hero-body">' +
                'Long-form posts on sector trends, trade reviews, market observations, ' +
                'and the research behind the dashboards, written to think through ideas ' +
                'more deeply than a screen of tickers can.' +
              '</p>' +
              (heroCta ? '<div class="hero-cta">' + heroCta + '</div>' : '') +
            '</div>' +
            '<div class="hero-image">' +
              '<img src="images/blogMain.jpg" alt="Printed equity research on a desk under a magnifying glass, beside tablets showing stock and sector performance charts" class="hero-img" width="1264" height="843" fetchpriority="high" decoding="async">' +
            '</div>' +
          '</div>' +
        '</section>' +
        '<section class="section">' +
          '<div class="container">' +
            '<div class="blog-grid">' +
              cards +
              '<article class="blog-card blog-card-placeholder">' +
                '<div class="blog-card-meta"><span class="blog-card-date">Coming Soon</span></div>' +
                '<h2 class="blog-card-title">More Research Posts on the Way</h2>' +
                '<p class="blog-card-excerpt">Future posts will cover sector deep-dives, trade reviews, dashboard research notes, and market observations.</p>' +
              '</article>' +
            '</div>' +
          '</div>' +
        '</section>';
    }

    // ── Post view ─────────────────────────────────────────────────────────

    function loadPost(slug) {
      Promise.all([
        fetch('Blog/posts.json').then(function (r) { return r.ok ? r.json() : []; }),
        fetch('Blog/' + slug + '.md').then(function (r) {
          if (!r.ok) throw new Error('not found');
          return r.text();
        })
      ])
      .then(function (res) {
        var meta = (res[0] || []).find(function (p) { return p.slug === slug; }) || {};
        renderPost(meta, res[1]);
      })
      .catch(function () {
        root.innerHTML =
          '<section class="section" style="min-height:60vh">' +
            '<div class="container">' +
              '<a href="blog.html" style="color:var(--accent-dark);font-size:0.8rem;font-weight:600;text-decoration:none;">← Back to Blog</a>' +
              '<p style="margin-top:2rem;color:var(--ink-3)">Post not found.</p>' +
            '</div>' +
          '</section>';
      });
    }

    function renderPost(meta, mdText) {
      if (meta.title) {
        var postTitle = meta.title + ' — The Invest Lab';
        var postUrl   = 'https://theinvestlab.com/blog.html?post=' + slug;
        var postDesc  = meta.excerpt || document.querySelector('meta[name="description"]').content;
        document.title = postTitle;
        document.querySelector('link[rel="canonical"]').href = postUrl;
        document.querySelector('meta[property="og:title"]').content   = postTitle;
        document.querySelector('meta[property="og:url"]').content     = postUrl;
        document.querySelector('meta[property="og:description"]').content = postDesc;
        document.querySelector('meta[name="twitter:title"]').content      = postTitle;
        document.querySelector('meta[name="twitter:description"]').content = postDesc;
      }

      // Strip the h1 and *Published date* / opening --- from markdown body
      var body = mdText
        .replace(/^#[^\n]*\n+/, '')
        .replace(/^\*[^\n]*\*\s*\n+---\n+/, '')
        .trim();

      var htmlBody = marked.parse(body);

      var metaParts = [];
      if (meta.date)     metaParts.push('<span class="blog-meta-item">' + esc(meta.date) + '</span>');
      if (meta.readTime) metaParts.push('<span class="blog-meta-item">' + esc(meta.readTime) + '</span>');
      var metaHtml = metaParts.join('<span class="blog-meta-dot"></span>');

      var tagsHtml = (meta.tags || []).map(function (t) {
        return '<span class="blog-meta-tag">' + esc(t) + '</span>';
      }).join('');
      if (tagsHtml) metaHtml += (metaHtml ? '<span class="blog-meta-dot"></span>' : '') + tagsHtml;

      // Inject BlogPosting JSON-LD
      var ldScript = document.getElementById('ld-json-post') || document.createElement('script');
      ldScript.id = 'ld-json-post';
      ldScript.type = 'application/ld+json';
      ldScript.text = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": meta.title || '',
        "description": meta.excerpt || '',
        "datePublished": meta.date || '',
        "url": 'https://theinvestlab.com/blog.html?post=' + slug,
        "image": 'https://theinvestlab.com/images/favicon.png',
        "publisher": {
          "@type": "Organization",
          "name": "The Invest Lab",
          "logo": { "@type": "ImageObject", "url": "https://theinvestlab.com/images/logo.png" }
        }
      });
      document.head.appendChild(ldScript);

      root.innerHTML =
        '<section class="blog-hero">' +
          '<div class="container">' +
            '<a href="blog.html" class="blog-back">← Back to Blog</a>' +
            '<h1 class="blog-hero-title">' + esc(meta.title || '') + '</h1>' +
            '<div class="blog-hero-meta">' + metaHtml + '</div>' +
          '</div>' +
        '</section>' +
        '<section class="blog-article">' +
          '<div class="container">' +
            '<div class="blog-body">' + htmlBody + '</div>' +
          '</div>' +
        '</section>';
    }

    // ── Helpers ───────────────────────────────────────────────────────────

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function errHtml(msg) {
      return '<div class="blog-loading">' + esc(msg) + '</div>';
    }

  }());
  </script>

</body>
</html>
