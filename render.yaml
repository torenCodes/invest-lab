# Render service map for The Invest Lab.
#
# NOTE: this file is DOCUMENTATION, not a live Blueprint. The five services
# below were created by hand in the Render dashboard, which remains the source
# of truth for their settings (including the CORS header rule on the Movers
# service — Render static sites ignore `_headers` files, so the Movers Flask
# app is the CORS-enabled data API the homepage fetches from).
#
# Keep this file in sync by hand when a service changes.

services:

  # The only dynamic service. Serves the Movers & Shakers dashboard AND acts as
  # the CORS-enabled JSON API for the homepage (results, cadence, coil,
  # newsstand, market temperature, homepage leaders, nominees archive).
  - type: web
    name: invest-movers-shakers
    runtime: python
    rootDir: Website/MarketDashboard
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py

  # Static dashboards. Each reads pre-computed JSON from its own data/ folder,
  # written by the GitHub Actions scans in Website/scripts/ and committed to
  # the repo, which triggers the Render auto-deploy.
  - type: static
    name: invest-the-marathon
    rootDir: Website/TheMarathon
    staticPublishPath: .
    buildCommand: ""

  - type: static
    name: invest-insider-buying
    rootDir: Website/InsiderBuying
    staticPublishPath: .
    buildCommand: ""

  - type: static
    name: invest-patterns
    rootDir: Website/PatternScanner
    staticPublishPath: .
    buildCommand: ""

  - type: static
    name: invest-the-analyst
    rootDir: Website/TheAnalyst
    staticPublishPath: .
    buildCommand: ""

# Retired: invest-tried-true and invest-underdogs were merged into The Marathon
# (tabs) in April 2026 and deleted from Render. Their legacy folders keep only
# scan.py, which still feeds TheMarathon/data/ via GitHub Actions.
