services:

  - type: web
    name: invest-movers-shakers
    runtime: python
    rootDir: Website/MarketDashboard
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py

  - type: web
    name: invest-tried-true
    runtime: python
    rootDir: Website/TriedAndTrue
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py

  # The Analyst migrated from live Flask (type: web) to a Static Site that
  # serves index.html and reads pre-computed deep-dive analyses from
  # data/results.json. The cross-dashboard scan that produces that file is
  # Website/scripts/analyst_scan.py, run on a daily GitHub Actions schedule.
  - type: static
    name: invest-the-analyst
    rootDir: Website/TheAnalyst
    staticPublishPath: .
    buildCommand: ""

  - type: static
    name: invest-insider-buying
    rootDir: Website/InsiderBuying
    staticPublishPath: .
    buildCommand: ""

  - type: static
    name: invest-underdogs
    rootDir: Website/Underdogs
    staticPublishPath: .
    buildCommand: ""

  - type: static
    name: invest-the-marathon
    rootDir: Website/TheMarathon
    staticPublishPath: .
    buildCommand: ""

  - type: static
    name: invest-patterns
    rootDir: Website/PatternScanner
    staticPublishPath: .
    buildCommand: ""
