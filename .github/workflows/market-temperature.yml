name: Market Temperature Scan

on:
  schedule:
    # THIS IS NOT THE REAL SCHEDULE. cron-job.org dispatches this workflow at
    # '50 9,10 * * 1-5' America/New_York (9:50am and 10:50am ET, weekdays).
    #
    # Why: GitHub's own scheduler ran the old '0 10' (6am ET) entry FOUR TO SIX
    # HOURS LATE every weekday for two weeks - the Actions tab confirmed the
    # trigger was "Scheduled", not anything external - so the homepage showed
    # yesterday's number all morning. The first cron-job.org dispatch landed
    # 91 seconds after its slot. Check cron-job.org, not this file, for when
    # the gauge actually refreshes; runs from it show as repository_dispatch.
    #
    # The 9:50 slot is deliberately AFTER the 9:35 market scan has had time to
    # commit, because Risk Posture reads sector rotation from results.json.
    #
    # The single entry below is only a fallback so a cron-job.org outage cannot
    # leave the gauge stale for more than a day. Post-close and off-the-hour,
    # staggered from newsstand's fallback so the two never queue together.
    - cron: '5 22 * * 1-5'    # ~6:05pm EDT / 5:05pm EST (after the close)
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Website/scripts/requirements-market-temperature.txt

      # Must run BEFORE the temperature scan, which reads insider_pulse.json as
      # one of its components. The five-year history is committed, so this only
      # refreshes the current window unless the history file is missing.
      - name: Run insider pulse scan
        run: python Website/scripts/insider_pulse_scan.py

      - name: Run market temperature scan
        run: python Website/scripts/market_temperature_scan.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add Website/MarketDashboard/data/market_temperature.json Website/MarketDashboard/data/insider_pulse.json Website/data/insider_history.json
          git diff --staged --quiet || git commit -m "chore: temperature + insider pulse scan $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase -Xtheirs origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
