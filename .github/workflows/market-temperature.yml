name: Market Temperature Scan

on:
  schedule:
    # Two weekday runs so a single failure cannot leave the gauge a day stale.
    #
    # The old single entry was '0 10' (6am ET), yet for the two weeks before
    # this change every run landed at 13:56-16:06 UTC - four-plus hours late,
    # every day. Whatever the cause, the page showed yesterday's number all
    # morning. Do not trust the cron here to tell you when this actually runs;
    # check the Actions tab (and cron-job.org, if an entry exists there).
    #
    # Off-the-hour minutes on purpose: GitHub's queue is most congested at :00.
    #
    # First slot is deliberately AFTER the 9:35 market scan has had time to
    # commit, because Risk Posture reads sector rotation from results.json - a
    # 9:35 run here would score yesterday's posture.
    - cron: '50 13 * * 1-5'   # ~9:50am EDT / 8:50am EST  (just after the open)
    - cron: '50 14 * * 1-5'   # ~10:50am EDT / 9:50am EST (one hour later, backup)
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Website/scripts/requirements-market-temperature.txt

      # Must run BEFORE the temperature scan, which reads insider_pulse.json as
      # one of its components. The five-year history is committed, so this only
      # refreshes the current window unless the history file is missing.
      - name: Run insider pulse scan
        run: python Website/scripts/insider_pulse_scan.py

      - name: Run market temperature scan
        run: python Website/scripts/market_temperature_scan.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add Website/MarketDashboard/data/market_temperature.json Website/MarketDashboard/data/insider_pulse.json Website/data/insider_history.json
          git diff --staged --quiet || git commit -m "chore: temperature + insider pulse scan $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase -Xtheirs origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
