name: MarketDashboard Scan

on:
  schedule:
    # 6 runs/day across the trading day (single UTC entry each; ~1hr drift in EST vs EDT)
    - cron: '0 13 * * 1-5'    # ~9:00am EDT / 8:00am EST
    - cron: '35 13 * * 1-5'   # ~9:35am EDT / 8:35am EST
    - cron: '0 14 * * 1-5'    # ~10:00am EDT / 9:00am EST
    - cron: '30 15 * * 1-5'   # ~11:30am EDT / 10:30am EST
    - cron: '30 17 * * 1-5'   # ~1:30pm EDT / 12:30pm EST
    - cron: '15 19 * * 1-5'   # ~3:15pm EDT / 2:15pm EST
  workflow_dispatch:           # Manual trigger button in GitHub UI

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Website/MarketDashboard/requirements-scan.txt

      - name: Run market scan
        run: python Website/MarketDashboard/scan.py
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}

      - name: Archive top nominee
        run: python Website/scripts/archive_nominee.py --source movers

      - name: Archive emerging-chatter pick (Phase B data-gathering)
        run: python Website/scripts/archive_nominee.py --source chatter

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add Website/MarketDashboard/data/results.json Website/MarketDashboard/data/nominees_archive.json
          [ -f Website/MarketDashboard/data/scan_universe.json ] && git add Website/MarketDashboard/data/scan_universe.json || true
          git diff --staged --quiet || git commit -m "chore: market scan $(date -u +%Y-%m-%dT%H:%M)Z"
          # Several scans push to main; two landing in the same second made one
          # push fail ("cannot lock ref") and drop that run's update. Retry.
          for attempt in 1 2 3 4; do
            git pull --rebase -Xtheirs origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            if [ "$attempt" = 4 ]; then echo "::error::push failed after 4 attempts"; exit 1; fi
            git rebase --abort 2>/dev/null || true
            echo "push collided (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done
