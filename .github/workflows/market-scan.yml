name: MarketDashboard Scan

on:
  schedule:
    # 4 runs/day across the trading day (single UTC entry each; ~1hr drift in EST vs EDT)
    - cron: '35 13 * * 1-5'   # ~9:35am EDT / 8:35am EST
    - cron: '30 15 * * 1-5'   # ~11:30am EDT / 10:30am EST
    - cron: '30 17 * * 1-5'   # ~1:30pm EDT / 12:30pm EST
    - cron: '15 19 * * 1-5'   # ~3:15pm EDT / 2:15pm EST
  workflow_dispatch:           # Manual trigger button in GitHub UI

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r MarketDashboard/requirements-scan.txt

      - name: Run market scan
        run: python MarketDashboard/scan.py
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}

      - name: Archive top nominee
        run: python scripts/archive_nominee.py --source movers

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add MarketDashboard/data/results.json Website/data/nominees_archive.json
          git diff --staged --quiet || git commit -m "chore: market scan $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase -Xtheirs origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
