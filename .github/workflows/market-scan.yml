name: MarketDashboard Scan

on:
  schedule:
    # 9:35am ET — 5 min after opening bell (EST + EDT)
    - cron: '35 14 * * 1-5'
    - cron: '35 13 * * 1-5'
    # 11:30am ET — 2 hours after open (EST + EDT)
    - cron: '30 16 * * 1-5'
    - cron: '30 15 * * 1-5'
    # 1:30pm ET — 4 hours after open (EST + EDT)
    - cron: '30 18 * * 1-5'
    - cron: '30 17 * * 1-5'
  workflow_dispatch:           # Manual trigger button in GitHub UI

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r MarketDashboard/requirements-scan.txt

      - name: Run market scan
        run: python MarketDashboard/scan.py
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add MarketDashboard/data/results.json
          git diff --staged --quiet || git commit -m "chore: market scan $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase -Xtheirs origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
