name: TriedAndTrue Scan

on:
  schedule:
    - cron: '0 14 * * 1'   # Mondays ~9am ET
  workflow_dispatch:         # Manual trigger button in GitHub UI

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r TriedAndTrue/requirements-scan.txt

      - name: Run scan
        run: python TriedAndTrue/scan.py

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add TriedAndTrue/data/results.json
          git diff --staged --quiet || git commit -m "chore: tried-and-true scan $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
