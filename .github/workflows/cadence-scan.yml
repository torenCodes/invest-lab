name: Cadence Scan

on:
  schedule:
    # ~10:00am ET weekdays (14:00 UTC EDT). Moved later than pre-market so the
    # prior session's EOD data has settled on Polygon's free tier — the free
    # tier serves prior-day data (never same-day), and that data isn't
    # published until well after the close, so an early run only sees T-2.
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Website/scripts/requirements-cadence.txt

      - name: Run Cadence scan
        run: python Website/scripts/cadence_scan.py
        env:
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add Website/MarketDashboard/data/cadence.json Website/scripts/sector_map.json
          git diff --staged --quiet || git commit -m "chore: cadence scan $(date -u +%Y-%m-%dT%H:%M)Z"
          # Several scans push to main; two landing in the same second made one
          # push fail ("cannot lock ref") and drop that run's update. Retry.
          for attempt in 1 2 3 4; do
            git pull --rebase -Xtheirs origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            if [ "$attempt" = 4 ]; then echo "::error::push failed after 4 attempts"; exit 1; fi
            git rebase --abort 2>/dev/null || true
            echo "push collided (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done
