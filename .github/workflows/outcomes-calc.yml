name: Calculate Nominee Outcomes

on:
  schedule:
    # Weekdays at ~10am ET — fills each nominee's 30-day outcome within a day of
    # maturing (was Mondays-only, which left outcomes lagging up to a week).
    - cron: '30 14 * * 1-5'
  workflow_dispatch:   # Manual trigger button in GitHub UI

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance

      - name: Calculate 30-day outcomes
        run: python Website/scripts/calculate_outcomes.py

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add Website/MarketDashboard/data/nominees_archive.json
          git diff --staged --quiet || git commit -m "chore: nominee outcomes $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase -Xtheirs origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
