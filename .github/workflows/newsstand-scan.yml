name: Newsstand Scan

on:
  schedule:
    # 3x/day weekdays (single UTC entry each; ~1hr drift in EST vs EDT).
    # Morning scan deliberately runs an HOUR after market open (9:30 ET),
    # because Finviz's unusual-volume screener is still showing yesterday's
    # session until intraday volume accumulates.
    - cron: '30 14 * * 1-5'   # ~9:30am EST / 10:30am EDT  (1hr post-open)
    - cron: '0 17 * * 1-5'    # ~12:00pm EST / 1:00pm EDT
    - cron: '0 20 * * 1-5'    # ~3:00pm EST / 4:00pm EDT
  workflow_dispatch:            # Manual trigger

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Website/scripts/requirements-newsstand.txt

      - name: Run newsstand scan
        run: python Website/scripts/newsstand_scan.py
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add Website/MarketDashboard/data/newsstand.json
          git diff --staged --quiet || git commit -m "chore: newsstand scan $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase -Xtheirs origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
