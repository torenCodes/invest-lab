name: Newsstand Scan

on:
  schedule:
    # THIS IS NOT THE REAL SCHEDULE. cron-job.org dispatches this workflow, on
    # a market-hours cadence — cron '30 10,12,14,16 * * 1-5' in the
    # America/New_York timezone, i.e. 10:30am / 12:30 / 2:30 / 4:30pm ET —
    # because GitHub's cron queue runs 15-60min late through the US
    # morning. Check cron-job.org before trusting anything written here: the
    # previous version of this comment claimed "3x/day weekdays" while the job
    # was actually firing every 2 hours, around the clock, 7 days a week —
    # 99 runs and 99 Render redeploys in a single week.
    #
    # The first market-hours run is deliberately an HOUR after the 9:30 open,
    # because Finviz's unusual-volume screener still shows yesterday's session
    # until intraday volume accumulates.
    #
    # The single entry below is only a fallback, so a cron-job.org outage
    # cannot leave the homepage stale indefinitely. Kept to one post-close slot
    # on purpose so it does not double up on the external trigger.
    - cron: '45 21 * * 1-5'   # ~5:45pm EDT / 4:45pm EST (after the close)
  workflow_dispatch:            # Manual trigger

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Website/scripts/requirements-newsstand.txt

      - name: Run newsstand scan
        run: python Website/scripts/newsstand_scan.py
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add Website/MarketDashboard/data/newsstand.json
          git diff --staged --quiet || git commit -m "chore: newsstand scan $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase -Xtheirs origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
