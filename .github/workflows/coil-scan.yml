name: Coil Scan

on:
  schedule:
    # Pre-market, ~7:30am ET weekdays (11:30 UTC EDT). Staggered 30 min after
    # the Cadence scan so the two don't hammer Polygon's free tier at once.
    # Builds the swing-setup watchlist off the last completed session
    # (Polygon free tier serves prior-day data, not same-day).
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Website/scripts/requirements-coil.txt

      - name: Run Coil scan
        run: python Website/scripts/coil_scan.py
        env:
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}

      - name: Mirror coil.json to the Movers data API (CORS-enabled for the homepage)
        run: cp Website/PatternScanner/data/coil.json Website/MarketDashboard/data/coil.json

      - name: Archive top nominee
        run: python Website/scripts/archive_nominee.py --source patterns

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add Website/PatternScanner/data/coil.json Website/MarketDashboard/data/coil.json Website/MarketDashboard/data/nominees_archive.json
          git diff --staged --quiet || git commit -m "chore: coil scan $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase -Xtheirs origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
