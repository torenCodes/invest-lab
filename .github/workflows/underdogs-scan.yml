name: Underdogs Scan

on:
  schedule:
    # Mon/Wed/Fri ~9am ET (single entry; ~1hr drift EST vs EDT)
    - cron: '0 13 * * 1,3,5'
  workflow_dispatch:         # Manual trigger button in GitHub UI

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Website/Underdogs/requirements-scan.txt

      - name: Run scan
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python Website/Underdogs/scan.py

      - name: Archive top nominee
        run: python Website/scripts/archive_nominee.py --source underdogs

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add Website/TheMarathon/data/deep_value.json Website/MarketDashboard/data/nominees_archive.json
          git diff --staged --quiet || git commit -m "chore: underdogs scan $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase -Xtheirs origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
